# The collection published by `.github/workflows/plugins.yml` to the single
# `release` branch. Build that tree with:
#   cairn agent marketplace agent-marketplace.yaml --layout release --output ./dist-plugins
# Build the nested per-target tree, which is what `--install` consumes:
#   cairn agent marketplace agent-marketplace.yaml --output ./dist-plugins
# Install it locally with:
#   cairn agent marketplace agent-marketplace.yaml --install --register
schemaVersion: "1"
name: cairn
version: 1.2.0
description: Cairn's own toolsets, as plugins.
owner:
  name: Bryan Stockus
  url: https://github.com/cairn-tool

# Every host the release branch serves. The first three declare a marketplace
# catalog; Antigravity does not, so it gets a rendered tree and no catalog and is
# installed straight from the published sources under `bundles/`. That is what
# publishing the sources buys: a host with no marketplace concept is served off
# the same branch as one that has.
#
# OpenCode is deliberately absent. Its profile declares no *user*-scope install
# location at all, so nothing on a release branch can be installed for it; it is
# a project-scope merge, which `agent install` does from a checkout.
# `scripts/check-bundles.sh` still renders and checks every bundle for all five.
targets: [claude-code, codex, cursor, antigravity]

bundles:
  - path: plugins/cairn-markdown
  - path: plugins/cairn-scripts
  - path: plugins/cairn-usage
  - path: plugins/cairn-archive
  - path: plugins/cairn-agent
  - path: plugins/cairn-jira
  - path: plugins/cairn-pdf
  - path: plugins/cairn-qa
