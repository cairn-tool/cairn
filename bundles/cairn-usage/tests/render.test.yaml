# Contract tests: what this bundle must render. No tree digest -- one would
# invalidate on every prose edit and on any formatter pass.
schemaVersion: "1"
cases:
  - name: renders-a-complete-claude-code-plugin
    targets: [claude-code]
    profiles: [plugin]
    expect:
      paths:
        present:
          - .claude-plugin/plugin.json
          - skills/{name}/SKILL.md
          - assets/cli-basics.md
          - agents/usage-analyst.md
        absent:
          # Rules are project-profile only, and a command here is a skill --
          # there is no `commands` component kind.
          - .claude/rules/**
          - commands/**
          # No hook and no MCP server here; the subagent is the only
          # non-skill surface.
          - hooks/**
          - .mcp.json
      json:
        - path: .claude-plugin/plugin.json
          contains:
            name: cairn-usage
            version: 1.2.0

  # `agents` and `hooks` are implied manifest fields. Declaring `agents` fails
  # the whole manifest; declaring `hooks` drops the plugin's hooks. Neither is
  # caught by `claude plugin validate`.
  - name: manifest-omits-the-implied-fields
    targets: [claude-code]
    profiles: [plugin]
    expect:
      files:
        - path: .claude-plugin/plugin.json
          excludes: ['"agents"', '"hooks"']
          includes: ['"skills"']

  # Pins the slash-command mechanism -- invocationPolicy and argumentHint
  # through the target profile's frontmatter-flag form.
  - name: explicit-skills-are-user-invocable-only
    targets: [claude-code]
    profiles: [plugin]
    expect:
      files:
        - path: skills/usage-today/SKILL.md
          mode: "0644"
          includes: ["disable-model-invocation: true", "argument-hint:"]

  # The exclusion is newline-anchored to the frontmatter line: a bare substring
  # would also match a skill whose prose documents the flag, which the
  # cairn-agent skills legitimately do.
  - name: auto-skills-stay-model-invocable
    targets: [claude-code]
    profiles: [plugin]
    expect:
      files:
        - path: skills/usage-reports/SKILL.md
          excludes: ["\ndisable-model-invocation: true\n"]
        - path: skills/usage-store/SKILL.md
          excludes: ["\ndisable-model-invocation: true\n"]

  - name: the-shared-reference-asset-ships
    targets: [claude-code]
    profiles: [plugin]
    expect:
      files:
        - path: assets/cli-basics.md
          includes: ["## Exit codes", "@cairn-tool/cairn"]

  # Cursor namespaces a plugin's agents as well as its skills, on the frontmatter
  # `name` as well as the path -- the directory used to be prefixed while `name:`
  # stayed bare, which is one component with two identities. And no reference may
  # reach the tree unexpanded: a literal marker there is a defect the host shows
  # to the user.
  - name: the-cursor-plugin-namespaces-components-and-resolves-references
    targets: [cursor]
    profiles: [plugin]
    expect:
      paths:
        present:
          - agents/cairn-usage-usage-analyst.md
          - skills/cairn-usage-usage-reports/SKILL.md
        absent:
          - agents/usage-analyst.md
      files:
        - path: agents/cairn-usage-usage-analyst.md
          includes: ["name: cairn-usage-usage-analyst"]
          excludes: ["<!-- ref:"]
        - path: skills/cairn-usage-usage-reports/SKILL.md
          includes: ["name: cairn-usage-usage-reports"]
          excludes: ["<!-- ref:"]
