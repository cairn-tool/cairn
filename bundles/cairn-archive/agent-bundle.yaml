# Portable agent bundle. Built as part of the collection:
#   cairn agent marketplace ../../agent-marketplace.yaml --output ../../dist-plugins
schemaVersion: "2"
name: cairn-archive
version: 1.2.0
description: Archive assistant plans, artifacts, and transcripts into long-term storage.

marketplace:
  displayName: Cairn Archive
  summary: Copy what an assistant leaves behind into storage that outlives the tool.
  description: >-
    Incremental, content-addressed archiving of plan documents, produced files,
    session transcripts, and logs. Segments are ordinary `.tar.gz` files that
    `tar` recovers with no index and no `cairn`. Wraps the `cairn` CLI, which
    must be installed separately.
  categories: [productivity, developer-tools]
  keywords: [archive, backup, transcripts, storage]
  publisher:
    name: Bryan Stockus
    url: https://github.com/cairn-tool
  license: MIT
  icon: assets/icon.svg
