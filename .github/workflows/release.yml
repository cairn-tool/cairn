name: Release

# Gated on CI rather than on push. Running both off `push` let a release publish
# while the CI matrix was still red: v1.0.2 shipped declaring Node 20 support that
# jsdom 30 does not have, because this job only ever tested the .nvmrc version.
# Waiting for CI also means the whole support matrix has passed, and lets this job
# skip re-running the tests.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  # `npm ci` runs `prepare: husky`, which would install the commit-msg hook into the
  # runner's checkout — and that hook would then reject semantic-release's own
  # release commit. Git hooks have no purpose in CI.
  HUSKY: 0

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # git tags, CHANGELOG commit, GitHub Release
      issues: write # semantic-release success comments
      pull-requests: write
      id-token: write # provenance attestation for the published tarball
    # Only for a green CI run on a push to main — not for PR CI runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Explicit ref: a workflow_run checkout otherwise defaults to the default
          # branch tip anyway, and naming it keeps us on a branch rather than a
          # detached HEAD, which semantic-release needs in order to push.
          ref: main
          # semantic-release needs full history + tags to determine the last release
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: "@cairn-tool"

      - run: npm ci

      # No test step: this job only runs after the CI workflow went green across
      # the full Node matrix, so re-running them here would duplicate that work.

      # `publishConfig` in package.json carries `access: public` (scoped packages
      # default to restricted) and `provenance: true`, which needs the id-token
      # permission above plus a public repository. Both are load-bearing.
      - name: semantic-release
        env:
          # GITHUB_TOKEN is for the tag, the GitHub Release, and the CHANGELOG
          # commit. The npm registry is a separate identity now, so it needs its
          # own credential rather than reusing this one.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
