name: CI

# `pull_request`, deliberately **not** `pull_request_target`. This workflow checks
# out and executes the PR's own code, so it must run with the fork's read-only
# token and no access to secrets. Switching the trigger would hand a fork's code
# a writable token and this repository's secrets.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing by default; each job grants only what it needs.
permissions: {}

env:
  # Git hooks serve no purpose in CI; the commitlint job checks messages explicitly.
  HUSKY: 0

jobs:
  quality:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      # Blocks a PR that introduces a dependency with a known high-severity
      # advisory. Needs a base and a head to diff, so it is a no-op on push.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Must stay within package.json "engines". jsdom is the binding constraint
        # (^22.22.2 || ^24.15.0 || >=26.0.0); Node 20 is EOL and unsupported.
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # `pretest` builds dist/ first — the e2e suite spawns the compiled CLI.
      - name: Run tests
        run: npm test

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # semantic-release computes the next version from these messages, so a commit
      # that does not parse as a Conventional Commit silently produces no release.
      - name: Validate PR commits
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  plugins:
    name: Plugin bundles
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # Every bundle against every target, one bundle at a time so a failure
      # names the bundle rather than the collection. The gating rule is in
      # scripts/check-bundles.sh, and the short version is that it cannot be the
      # exit code: `agent validate` and `agent convert` route through
      # `hasFindings`, which fails on any `approximate` diagnostic, and only
      # claude-code renders these bundles with no findings at all. The other
      # four carry warnings that are properties of the host (AB302, AB310,
      # AB332, AB340, AB370), so they are gated on `error` diagnostics while
      # claude-code keeps the exit-0 bar it has always had.
      #
      # Marketplace publishing stays claude-code-only; this is a rendering and
      # portability check, and it needs no catalog. antigravity and opencode
      # declare no marketplace concept at all.
      - name: Validate, convert, doctor, test, and audit each bundle, on every target
        run: scripts/check-bundles.sh --output "$RUNNER_TEMP/conv"

      # Two builds, because --strict is only meaningful for one of the three
      # targets. Codex and Cursor carry `approximate` diagnostics inherently, so
      # a --strict build covering them would be permanently red; without the flag
      # `agent marketplace` still blocks on errors, which is what a missing
      # catalog field (AB500) or icon (AB502) is. Claude Code renders these
      # bundles with no findings at all, so it keeps the zero-warning bar it has
      # always had -- narrowed with --target, which may narrow the spec but never
      # widen it.
      - name: Build the Claude Code collection under --strict
        run: >-
          node dist/cli.js agent marketplace agent-marketplace.yaml
          --target claude-code --output "$RUNNER_TEMP/marketplace-strict" --strict

      - name: Build the collection for every declared target
        run: >-
          node dist/cli.js agent marketplace agent-marketplace.yaml
          --output "$RUNNER_TEMP/marketplace"

      # So a reviewer can `/plugin marketplace add` the built tree from a PR.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cairn-plugins
          path: ${{ runner.temp }}/marketplace

  dogfood:
    name: Self-lint markdown
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # The tool validating its own docs. Advisory for now — flip off
      # continue-on-error once the repo's markdown is clean under --style.
      - name: cairn md lint-dir
        continue-on-error: true
        run: node dist/cli.js md lint-dir . --style --summary
