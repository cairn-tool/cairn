name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Git hooks serve no purpose in CI; the commitlint job checks messages explicitly.
  HUSKY: 0

jobs:
  quality:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must stay within package.json "engines". jsdom is the binding constraint
        # (^22.22.2 || ^24.15.0 || >=26.0.0); Node 20 is EOL and unsupported.
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # `pretest` builds dist/ first — the e2e suite spawns the compiled CLI.
      - name: Run tests
        run: npm test

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # semantic-release computes the next version from these messages, so a commit
      # that does not parse as a Conventional Commit silently produces no release.
      - name: Validate PR commits
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  dogfood:
    name: Self-lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # The tool validating its own docs. Advisory for now — flip off
      # continue-on-error once the repo's markdown is clean under --style.
      - name: cairn md lint-dir
        continue-on-error: true
        run: node dist/cli.js md lint-dir . --style --summary
