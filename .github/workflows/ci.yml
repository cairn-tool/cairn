name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Git hooks serve no purpose in CI; the commitlint job checks messages explicitly.
  HUSKY: 0

jobs:
  quality:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must stay within package.json "engines". jsdom is the binding constraint
        # (^22.22.2 || ^24.15.0 || >=26.0.0); Node 20 is EOL and unsupported.
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # `pretest` builds dist/ first — the e2e suite spawns the compiled CLI.
      - name: Run tests
        run: npm test

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # semantic-release computes the next version from these messages, so a commit
      # that does not parse as a Conventional Commit silently produces no release.
      - name: Validate PR commits
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  plugins:
    name: Plugin bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # Each bundle on its own, so a failure names the bundle rather than the
      # collection. `agent validate` takes no --profile; `agent doctor --output`
      # takes a *conversion* root, never a package or collection root, or it
      # reports the catalog and integrity files as unmanaged. `agent audit` runs
      # without --strict: forwarded render warnings are expected, while audit's
      # own AUDIT_CODES warnings block regardless.
      - name: Validate, convert, doctor, test, and audit each bundle
        run: |
          set -euo pipefail
          for bundle in plugins/*/; do
            [ -f "$bundle/agent-bundle.yaml" ] || continue
            name=$(basename "$bundle")
            echo "::group::$name"
            node dist/cli.js agent validate "$bundle" --target claude-code
            node dist/cli.js agent convert  "$bundle" --target claude-code \
              --profile plugin --output "$RUNNER_TEMP/conv/$name"
            node dist/cli.js agent doctor   "$bundle" --target claude-code \
              --profile plugin --output "$RUNNER_TEMP/conv/$name"
            node dist/cli.js agent test     "$bundle" --target claude-code
            node dist/cli.js agent audit    "$bundle" --target claude-code --profile plugin
            echo "::endgroup::"
          done

      - name: Build the collection
        run: >-
          node dist/cli.js agent marketplace agent-marketplace.yaml
          --output "$RUNNER_TEMP/marketplace" --strict

      # So a reviewer can `/plugin marketplace add` the built tree from a PR.
      - uses: actions/upload-artifact@v5
        with:
          name: cairn-plugins
          path: ${{ runner.temp }}/marketplace

  dogfood:
    name: Self-lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # The tool validating its own docs. Advisory for now — flip off
      # continue-on-error once the repo's markdown is clean under --style.
      - name: cairn md lint-dir
        continue-on-error: true
        run: node dist/cli.js md lint-dir . --style --summary
