# Portable agent bundle. Render it with:
#   cairn agent marketplace ../../agent-marketplace.yaml --output ../../dist-plugins
schemaVersion: "2"
name: cairn-markdown
version: 1.0.0
description: Validate, analyze, and refactor Markdown with the cairn md toolset.

marketplace:
  displayName: Cairn Markdown
  summary: The cairn md toolset — linting, structure, queries, and safe refactors.
  description: >-
    Twenty-eight commands for working with Markdown workspaces: lint and audit,
    read structure without opening files, query a whole tree, and refactor with
    reference updates. Wraps the `cairn` CLI, which must be installed separately.
  categories: [documentation, quality]
  keywords: [markdown, lint, docs, mermaid, katex, markdownlint]
  publisher:
    name: Bryan Stockus
    url: https://github.com/cairn-tool
  license: MIT
